# ════════════════════════════════════════════════════════════════════
# Netlify Configuration — NexaCorp Business Auth
# ════════════════════════════════════════════════════════════════════

[build]
  publish  = "frontend"
  functions = "netlify/functions"
  command   = "echo 'Build complete ✓'"

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
[functions."signup"]
  timeout = 15
[functions."login"]
  timeout = 15
[functions."stats"]
  timeout = 15

# ── Redirects ────────────────────────────────────────────────────────
[[redirects]]
  from  = "/signup"
  to    = "/.netlify/functions/signup"
  status = 200
  force  = true

[[redirects]]
  from  = "/login"
  to    = "/.netlify/functions/login"
  status = 200
  force  = true

[[redirects]]
  from  = "/stats"
  to    = "/.netlify/functions/stats"
  status = 200
  force  = true

# Default home → login page
[[redirects]]
  from  = "/"
  to    = "/login.html"
  status = 302

# SPA fallback
[[redirects]]
  from  = "/*"
  to    = "/login.html"
  status = 200

# ── Security Headers ─────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
